name: Recomp preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: recomp-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: pickles976/DecompAtHome/.github/actions/recomp-preflight@f6c7d05ab9477ae7510bb7858fc1100713408330
        with:
          token: ${{ github.token }}
          api-url: ${{ github.api_url }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          trusted-actor-id: 348113819
