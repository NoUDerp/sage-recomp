name: Recomp issue commands

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recomp-issue-commands
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: pickles976/DecompAtHome/.github/actions/recomp-claims@936de7450d3d5f7bc96db8125f0c4517202d6759
        with:
          token: ${{ github.token }}
          api-url: ${{ github.api_url }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          trusted-actor-id: 348113819
