[project]
name = "sage-recomp"
goal = "port"
plugin = "sage-port"

# This project pins no target binary. The reference is source: the Godot-free
# SAGE engine core of openbfme-godot, built by the owner to mint golden vectors.
# Nothing from that checkout or build is ever committed here.
[reference]
upstream = "https://github.com/Open-BFME/openbfme-godot"
commit = "f45ea04a575677eaaf497f307548b60853528d4e"
library = "openbfme_core"
licence = "GPL-3.0-or-later"
engine = "sage"
tier = "t2-port"
toolchain = "Rust 1.96.0; golden-vector differential verification"
description = "Port openbfme_core's C++ modules to safe deterministic Rust for the Bevy 0.19 engine port"

[toolchain]
image = "ghcr.io/pickles976/sage-recomp-toolchain@sha256:32a34a3e20be0a28c3eb50f8455a9e0a599d235547323cc2b98815bcd8b28905"
framework_rev = "2340f2662612c714b4233a0b27c75536b38064e7"
base_image = "docker.io/library/rust@sha256:c993d32d95cc146bd12c84d66f0b924a6a96f3988325f39c144f2f9893dea120"

[github]
owner = "pickles976"
repository = "sage-recomp"
framework_action = "pickles976/DecompAtHome@936de7450d3d5f7bc96db8125f0c4517202d6759"
trusted_actor_id = 348113819

# Maintainer-owned beyond the framework defaults: the golden vectors, the C++
# reference harnesses, the minting tools and the setup scripts.
[policy]
protected_paths = ["framework/", "goldens/", "reference/", "tools/", "scripts/"]
# This proof of concept runs the coordinator and its contributors from one
# machine under a single GitHub account, so a one-claim-per-account limit would
# deadlock the pool: the coordinator's own smoke lease would block every
# contributor. Four keeps hoarding bounded while both lanes share an identity.
# Set this back to 1 once contributors sign in as themselves.
max_claims_per_account = 4
