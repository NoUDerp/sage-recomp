[plugin]
name = "lotr-bevy"
version = "0.1.0"
description = "Behaviorally recover BFME II game.dat functions as Rust modules"
capabilities = ["detect", "work", "verify", "port"]

[verify]
mode = "behavioral"
public = true
timeout_seconds = 300
max_artifact_bytes = 1048576
sandbox_nproc = 1024
sandbox_memory_mib = 2048
candidate_build = ["python3", "runner.py", "guest"]
candidate_run = ["python3", "runner.py", "guest"]
oracle_run = ["python3", "runner.py", "guest"]

[verify.protocol]
version = 1
cases = [
  "case-00", "case-01", "case-02", "case-03",
  "case-04", "case-05", "case-06", "case-07",
]

[commands]
detect = ["python3", "runner.py", "detect"]
work_plan = ["python3", "runner.py", "work-plan"]
run_task = ["python3", "runner.py", "run-task"]
verify = ["python3", "runner.py", "verify"]
selftest = ["python3", "runner.py", "selftest"]
guest = ["python3", "runner.py", "guest"]
